<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <style>
            body {
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-image: url(background.png);
                background-color: #f0f2f5;
                font-family: Arial, sans-serif;
            }

            .login-container {
                background-color: rgba(255, 255, 255, 0.75);
                padding: 20px;
                border: 1px solid rgba(0, 0, 0, 0.7);
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 300px;
                text-align: center;
            }
            .login-container h2 {
                margin-bottom: 20px;
            }
            .login-container input {
                width: calc(100% - 22px);
                padding: 10px;
                margin: 0 0 10px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .login-container button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                border: none;
                border-radius: 4px;
                color: white;
                font-size: 16px;
                cursor: pointer;
            }
            .login-container button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px">
                <img style="height: 80px" src="NJDOT-Seal.png" />
                <span><h1>GAMS Login</h1></span>
            </div>
            <div>
                <input id="username" type="text" placeholder="Username" required />
                <input id="password" type="password" placeholder="Password" required />
                <button type="submit">Login</button>
            </div>
        </div>

        <script>
            const CRED = 'cred_location_storage';
            document.querySelector('button').addEventListener('click', () => {
                const baseURL = 'http://127.0.0.1:65000/v1/';
                // const baseURL = 'https://gpi-inspections.com/gpi-viewer/data/v1/';
                const username = document.querySelector('#username').value;
                const password = document.querySelector('#password').value;

                fetch(baseURL + 'authenticate', {
                    method: 'POST', // or POST, PUT, DELETE, etc.
                    body: JSON.stringify({ username: username, password: password }),
                })
                    .then((response) => response.json())
                    .then((credentials) => {
                        window.localStorage.setItem(CRED, JSON.stringify(credentials));
                        window.location.href = '../map';
                    });
            });
        </script>
    </body>
</html>
