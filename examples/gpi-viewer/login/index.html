<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NJDOT GAMS: Login</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-image: url(background.jpg);
                background-repeat: no-repeat;
                background-size: cover;
                background-color: #f0f2f5;
                font-family: Arial, sans-serif;
            }

            .login-container {
                background-color: rgba(255, 255, 255, 0.75);
                padding: 20px;
                border: 1px solid rgba(0, 0, 0, 0.7);
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 300px;
                text-align: center;
            }
            .login-container h2 {
                margin-bottom: 20px;
            }
            .login-container input {
                width: calc(100% - 22px);
                padding: 10px;
                margin: 0 0 10px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .login-container button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                border: none;
                border-radius: 4px;
                color: white;
                font-size: 16px;
                cursor: pointer;
            }
            .login-container button:hover {
                background-color: #0056b3;
            }

            .banner-container {
                display: flex;
                gap: 10px;
                align-items: center;
                margin-bottom: 20px;
            }
            .error-message {
                margin: -10px 0 12px 4px;

                color: red;
                font-size: 0.75em;
                font-weight: bold;
            }

            .hidden {
                display: none;
            }

            .input-alignment {
                display: flex;
                flex-direction: column;
                text-align: left;
            }

            @keyframes horizontal-shaking {
                0% {
                    transform: translateX(0);
                }
                25% {
                    transform: translateX(5px);
                }
                50% {
                    transform: translateX(-5px);
                }
                75% {
                    transform: translateX(5px);
                }
                100% {
                    transform: translateX(0);
                }
            }

            button.error {
                animation: horizontal-shaking 0.35s 1;
                border: 2px solid red;
                background-color: red;
            }

            button.error:hover {
                background-color: red;
            }

            .loading-btn {
                position: relative;
                /* padding-left: 40px; */
                /* display: flex; */
                /* align-items: center; */
                /* flex-direction: row-reverse; */
            }

            .spinner {
                position: absolute;
                right: 10px;
                top: 50%;
                width: 20px;
                height: 20px;
                margin-top: -12px;
                border: 2px solid #f3f3f3;
                border-top: 2px solid #3498db;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            .button-text {
                flex: 1 auto;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="banner-container">
                <img style="height: 80px" src="NJDOT-Seal.png" />
                <span><h1>GAMS Login</h1></span>
            </div>
            <div class="input-alignment">
                <input id="username" type="text" placeholder="Username" />
                <div class="error-message hidden">verify username</div>

                <input id="password" type="password" placeholder="Password" />
                <div class="error-message hidden">verify password</div>

                <button id="submit" type="submit" class="loading-btn">
                    <span class="spinner hidden"></span>
                    <span class="button-text">Login</span>
                </button>

                <!-- <button id="submit" type="submit">Login</button> -->
            </div>
        </div>

        <script>
            const CRED = 'cred_location_storage';
            document.querySelector('button').addEventListener('click', () => {
                // const baseURL = 'http://127.0.0.1:65000/v1/';
                const baseURL = 'https://maps.gpinet.com/gpi-viewer/data/v1/';
                const username = document.querySelector('#username');
                const password = document.querySelector('#password');
                const spinner = document.querySelector('.spinner');

                spinner.classList.remove('hidden');

                fetch(baseURL + 'authenticate', {
                    method: 'POST', // or POST, PUT, DELETE, etc.
                    body: JSON.stringify({ username: username.value, password: password.value }),
                })
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            spinner.classList.add('hidden');
                            throw 'Login failed. Please check your credentials.';
                        }
                    })
                    .then((credentials) => {
                        window.localStorage.setItem(CRED, JSON.stringify(credentials));
                        window.location.href = '../map';
                    })
                    .catch((error) => {
                        const submitButton = document.querySelector('#submit');
                        const errorMessages = document.querySelectorAll('.error-message');
                        errorMessages.forEach((message) => {
                            message.classList.remove('hidden');
                        });
                        submitButton.classList.add('error');
                    });
            });
        </script>
    </body>
</html>
