    <head>
        <meta charset="utf-8" />

    <body>
        <div id="route-selector-container">
            <div id="branding"></div>
            <input type="text" placeholder="Filter by state route identifier..." />
            <div id="route-selector"></div>
        </div>
        <div id="map-container"></div>
        <div id="panel-container"></div>
        <div id="potree-container" class="hidden">
            <div id="close-lidar-viewer-button">
                <img src="http://localhost:1234/build/potree/resources/icons/reset_tools.svg" style="width: 32px; height: 32px" class="button-icon" />
            </div>
            <div id="classification-container"></div>
            <div id="controls">
                <div id="measurement-menu" class="tool-menu"></div>
                <!-- <div id="playback-menu" class="tool-menu">
                    <button id="play-button" class="functionality-button" title="Play Animation"><i class="bi bi-play-circle-fill"></i></button>
                    <button id="pause-button" class="functionality-button" title="Pause Animation"><i class="bi bi-pause-circle-fill"></i></button>
                </div> -->
            </div>
            <div id="potree_render_area" style="background-image: url('../../build/potree/resources/images/background.jpg')"></div>
            <div id="potree_sidebar_container"></div>
        </div>

        <calcite-alert id="no-results" auto-close auto-close-duration="fast" kind="danger" placement="top">
            <div class="error-saved-text" slot="title" style="text-align: center">No Results, please update your search.</div>
        </calcite-alert>

        <script src="../../../libs/jquery/jquery-3.1.1.min.js"></script>

        <script src="../../../libs/openlayers3/ol.js"></script>
        <script src="../../../libs/i18next/i18next.js"></script>
        <script src="../../../libs/jstree/jstree.js"></script>
        <script src="../../../build/potree/potree.js"></script>
        <script src="../../../libs/plasio/js/laslaz.js"></script>
        <script src="../../../libs/shapefile/shapefile.js"></script>

        <script src="https://js.arcgis.com/4.31/"></script>
        <script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>
        <script type="module" src="index.js"></script>
