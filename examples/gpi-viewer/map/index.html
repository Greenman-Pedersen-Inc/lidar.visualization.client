<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>NJDOT GAMS: Viewer</title>
        <link rel="icon" href="./favicon.ico?v=20261112.1" />

        <link rel="stylesheet" type="text/css" href="../../../build/potree/potree.css?v=20261112.1" />
        <link rel="stylesheet" type="text/css" href="../../../libs/jquery-ui/jquery-ui.min.css?v=20261112.1" />
        <link rel="stylesheet" type="text/css" href="../../../libs/openlayers3/ol.css?v=20261112.1" />
        <link rel="stylesheet" type="text/css" href="../../../libs/spectrum/spectrum.css?v=20261112.1" />
        <link rel="stylesheet" type="text/css" href="../../../libs/jstree/themes/mixed/style.css?v=20261112.1" />

        <link rel="stylesheet" type="text/css" href="https://unpkg.com/shepherd.js/dist/css/shepherd.css" />

        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
        <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css" />
        <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
        <link rel="stylesheet" type="text/css" href="./asset-filter.css?v=20261112.1" />
        <link rel="stylesheet" type="text/css" href="./index.css?v=20261112.1" />
    </head>

    <body>
        <div id="route-selector-container">
            <div id="branding"></div>
            <div class="hidden">
                <input type="text" placeholder="Filter by state route identifier..." />
                <div id="route-selector"></div>
            </div>
        </div>
        <div id="map-container"></div>
        <div class="feature-tab-container">
            <calcite-tabs id="feature-tables">
                <calcite-tab-nav id="feature-table-tab-nav" slot="title-group">
                    <calcite-tab-title selected>Rock & Soil Slope</calcite-tab-title>
                    <calcite-tab-title>Retaining Wall</calcite-tab-title>
                </calcite-tab-nav>
                <calcite-tab selected><div id="rock-slope-feature-table-container"></div></calcite-tab>
                <calcite-tab><div id="retaining-wall-feature-table-container"></div></calcite-tab>
            </calcite-tabs>
            <calcite-button id="restart-tour-button" icon-start="folder-plus" label="Restart Tour">Restart Tour</calcite-button>
        </div>
        <div id="panel-container"></div>
        <div id="potree-container" class="hidden">
            <div id="close-lidar-viewer-button">
                <img src="../../../build/potree/resources/icons/reset_tools.svg" style="width: 32px; height: 32px" class="button-icon" />
            </div>
            <div id="classification-container"></div>
            <div id="controls">
                <div id="measurement-menu" class="tool-menu"></div>
                <!-- <div id="playback-menu" class="tool-menu">
                    <button id="play-button" class="functionality-button" title="Play Animation"><i class="bi bi-play-circle-fill"></i></button>
                    <button id="pause-button" class="functionality-button" title="Pause Animation"><i class="bi bi-pause-circle-fill"></i></button>
                </div> -->
            </div>
            <div id="potree_render_area" style="background-image: url('../../../build/potree/resources/images/background.jpg')"></div>
            <div id="potree_sidebar_container"></div>
        </div>

        <calcite-alert id="no-results" auto-close auto-close-duration="fast" kind="danger" placement="top">
            <div class="error-saved-text" slot="title" style="text-align: center">No Results, please update your search.</div>
        </calcite-alert>

        <calcite-alert id="run-list-unavailable" kind="warning" placement="top" icon="exclamation-mark-triangle">
            <div slot="title">LiDAR runs are temporarily unavailable</div>
            <div slot="message">The map remains available. LiDAR runs will return when the data service recovers.</div>
        </calcite-alert>

        <script src="../../../libs/jquery/jquery-3.1.1.min.js?v=20261112.1"></script>
        <script src="../../../libs/spectrum/spectrum.js?v=20261112.1"></script>
        <script src="../../../libs/jquery-ui/jquery-ui.min.js?v=20261112.1"></script>
        <script src="../../../libs/other/BinaryHeap.js?v=20261112.1"></script>
        <script src="../../../libs/tween/tween.min.js?v=20261112.1"></script>
        <script src="../../../libs/d3/d3.js?v=20261112.1"></script>
        <script src="../../../libs/proj4/proj4.js?v=20261112.1"></script>
        <script src="../../../libs/openlayers3/ol.js?v=20261112.1"></script>
        <script src="../../../libs/i18next/i18next.js?v=20261112.1"></script>
        <script src="../../../libs/jstree/jstree.js?v=20261112.1"></script>
        <script src="../../../build/potree/potree.js?v=20261112.1"></script>
        <script src="../../../libs/plasio/js/laslaz.js?v=20261112.1"></script>
        <script src="../../../libs/shapefile/shapefile.js?v=20261112.1"></script>

        <script src="https://js.arcgis.com/4.31/"></script>
        <script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>

        <script type="module" src="index.js?v=20261112.1"></script>
    </body>
</html>
