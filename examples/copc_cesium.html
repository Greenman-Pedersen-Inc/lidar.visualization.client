<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>COPC with Cesium Basemap</title>

        <link rel="stylesheet" type="text/css" href="../build/potree/potree.css" />
        <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css" />
        <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css" />
        <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css" />
        <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css" />
        <link rel="stylesheet" type="text/css" href="../libs/Cesium/Widgets/CesiumWidget/CesiumWidget.css" />
    </head>

    <body>
        <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
        <script src="../libs/spectrum/spectrum.js"></script>
        <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
        <script src="../libs/other/BinaryHeap.js"></script>
        <script src="../libs/tween/tween.min.js"></script>
        <script src="../libs/d3/d3.js"></script>
        <script src="../libs/proj4/proj4.js"></script>
        <script src="../libs/openlayers3/ol.js"></script>
        <script src="../libs/i18next/i18next.js"></script>
        <script src="../libs/jstree/jstree.js"></script>
        <script src="../libs/copc/index.js"></script>
        <script src="../build/potree/potree.js"></script>
        <script src="../libs/plasio/js/laslaz.js"></script>
        <script src="../libs/Cesium/Cesium.js"></script>

        <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0">
            <div id="potree_render_area">
                <div id="cesium_container" style="position: absolute; width: 100%; height: 100%"></div>
            </div>
            <div id="potree_sidebar_container"></div>
        </div>

        <div
            id="viewer_controls"
            class="potree-roadway-toolbar"
        >
            <label for="copc_file_selector">Point cloud:</label>
            <select id="copc_file_selector"></select>
            <label id="roadway_selector_control" for="roadway_selector" hidden>Roadway:</label>
            <select id="roadway_selector" hidden></select>
        </div>

        <div id="roadway_visibility_controls" hidden style="display: none">
            <label id="pointcloud_visibility_control" for="pointcloud_visible"><input id="pointcloud_visible" type="checkbox" checked /> Point cloud</label>
            <label id="environment_visibility_control" for="environment_visible"><input id="environment_visible" type="checkbox" checked /> Basemap &amp; terrain</label>
        </div>

        <script type="module">
            import * as THREE from '../libs/three.js/build/three.module.js';

            const US_SURVEY_FOOT_TO_METERS = 1200 / 3937;
            const EPSG_3424 = '+proj=tmerc +lat_0=38.8333333333333 +lon_0=-74.5 +k=0.9999 +x_0=150000 +y_0=0 +datum=NAD83 +units=us-ft +no_defs';

            const getQueryParam = function (name) {
                name = name.replace(/[\[\]]/g, '\\$&');
                const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
                const results = regex.exec(window.location.href);
                if (!results || !results[2]) return null;
                return decodeURIComponent(results[2].replace(/\+/g, ' '));
            };

            const embedded = getQueryParam('embed') === '1';
            if (embedded) {
                document.getElementById('viewer_controls').style.display = 'none';
            }

            const manifestUrl = new URL('./resources/copc-manifest.json', window.location.href);
            const manifestResponse = await fetch(manifestUrl);
            if (!manifestResponse.ok) {
                throw new Error(`Failed to load COPC manifest: ${manifestResponse.status}`);
            }

            const manifest = await manifestResponse.json();
            const files = manifest.files.map((file) => ({
                ...file,
                url: new URL(file.path, manifest.baseUrl).href,
            }));
            if (files.length === 0) {
                throw new Error('The COPC manifest contains no files');
            }

            const requested = getQueryParam('r') || 'all';
            const loadAll = requested === 'all';
            const selected = files.find((file) => requested === file.path || requested === file.name || requested === file.url) || files[0];
            const path = requested.startsWith('http') ? requested : selected.url;
            const filesToLoad = loadAll ? files : [{ ...selected, url: path }];

            const selector = document.getElementById('copc_file_selector');
            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = `All point clouds (${files.length})`;
            allOption.selected = loadAll;
            selector.appendChild(allOption);
            files.forEach((file) => {
                const option = document.createElement('option');
                option.value = file.url;
                option.textContent = file.name;
                option.selected = !loadAll && file.url === path;
                selector.appendChild(option);
            });
            selector.addEventListener('change', () => {
                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.set('r', selector.value);
                window.location.assign(nextUrl);
            });

            const requestedTerrain = getQueryParam('terrain');
            const terrainUrl = requestedTerrain === 'none'
                ? null
                : requestedTerrain || manifest.terrainUrl;
            const cesiumOptions = {
                useDefaultRenderLoop: false,
                animation: false,
                baseLayerPicker: false,
                fullscreenButton: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                navigationHelpButton: false,
                imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
                    url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',
                }),
                terrainShadows: Cesium.ShadowMode.DISABLED,
            };
            const requestedTerrainExaggeration = Number(getQueryParam('exaggeration'));
            if (Number.isFinite(requestedTerrainExaggeration) && requestedTerrainExaggeration > 0) {
                cesiumOptions.terrainExaggeration = requestedTerrainExaggeration;
            }
            let terrainProvider = null;
            if (terrainUrl) {
                terrainProvider = new Cesium.CesiumTerrainProvider({
                    url: terrainUrl,
                    requestVertexNormals: true,
                });
                cesiumOptions.terrainProvider = terrainProvider;
            }
            window.cesiumViewer = new Cesium.Viewer('cesium_container', cesiumOptions);
            const environmentVisibleInput = document.getElementById('environment_visible');
            function setEnvironmentVisibility(visible) {
                for (let index = 0; index < cesiumViewer.imageryLayers.length; index++) {
                    cesiumViewer.imageryLayers.get(index).show = visible;
                }
                cesiumViewer.scene.globe.baseColor = visible
                    ? Cesium.Color.WHITE
                    : Cesium.Color.fromCssColorString('#9ca4ab');
                cesiumViewer.terrainProvider = visible && terrainProvider
                    ? terrainProvider
                    : new Cesium.EllipsoidTerrainProvider();
            }
            environmentVisibleInput.addEventListener('change', () => setEnvironmentVisibility(environmentVisibleInput.checked));

            window.potreeViewer = new Potree.Viewer(document.getElementById('potree_render_area'), {
                useDefaultRenderLoop: false,
            });
            potreeViewer.setEDLEnabled(true);
            potreeViewer.setFOV(60);
            const requestedPointBudget = Number(getQueryParam('budget'));
            const pointBudget = Number.isFinite(requestedPointBudget) && requestedPointBudget > 0 ? requestedPointBudget : 5_000_000;
            potreeViewer.setPointBudget(pointBudget);
            potreeViewer.setMinNodeSize(10);
            potreeViewer.loadSettingsFromURL();
            potreeViewer.setBackground(null);
            potreeViewer.setControls(potreeViewer.earthControls);
            potreeViewer.useHQ = true;

            potreeViewer.loadGUI(() => {
                potreeViewer.setLanguage('en');
                $('#menu_appearance').next().show();
                $('#menu_scene').next().show();
            });

            const loaded = await Promise.all(filesToLoad.map((file) => Potree.loadPointCloud(file.url, file.name)));
            loaded.forEach((event) => {
                potreeViewer.scene.addPointCloud(event.pointcloud);
                const material = event.pointcloud.material;
                material.size = 1;
                material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                material.activeAttributeName = getQueryParam('c') || 'rgba';
            });
            const pointcloudVisibleInput = document.getElementById('pointcloud_visible');
            pointcloudVisibleInput.addEventListener('change', () => {
                loaded.forEach((event) => {
                    event.pointcloud.visible = pointcloudVisibleInput.checked;
                });
            });

            const pointcloudProjection = loaded[0].pointcloud.projection || EPSG_3424;
            const toMap = proj4(pointcloudProjection, proj4.defs('WGS84'));
            const offsetParameter = getQueryParam('offset');
            const requestedVerticalOffset = offsetParameter === null ? Number.NaN : Number(offsetParameter);
            const verticalOffset = Number.isFinite(requestedVerticalOffset) ? requestedVerticalOffset : -33;
            potreeViewer.fitToScreen(0.5);

            const queryRoadwayCsv = getQueryParam('roadwayCsv');
            const roadwayConfigurations = Array.isArray(manifest.roadwayImagery)
                ? manifest.roadwayImagery.slice()
                : [];
            if (queryRoadwayCsv) {
                const queryCsvUrl = new URL(queryRoadwayCsv, manifestUrl);
                roadwayConfigurations.push({
                    name: getQueryParam('roadwayName') || 'Roadway imagery',
                    csv: queryCsvUrl.href,
                    images: getQueryParam('roadwayImages') || new URL('.', queryCsvUrl).href,
                });
            }

            const roadwaySelector = document.getElementById('roadway_selector');
            const roadwaySelectorControl = document.getElementById('roadway_selector_control');
            let roadwayNavigator = null;
            let roadwayImages = null;

            function resolveManifestUrl(path) {
                return new URL(path, manifestUrl).href;
            }

            function getRoadwayCalibration(configuration) {
                const defaults = {
                    headingOffset: Number(configuration.headingOffset) || 0,
                    pitchOffset: Number(configuration.pitchOffset) || 0,
                    rollOffset: Number(configuration.rollOffset) || 0,
                    positionOffset: Array.isArray(configuration.positionOffset)
                        ? configuration.positionOffset.map((value) => Number(value) || 0)
                        : [0, 0, 0],
                };
                const storageKey = `potree-roadway-calibration:${configuration.name || configuration.csv}`;
                let saved = {};
                try {
                    saved = JSON.parse(window.localStorage.getItem(storageKey)) || {};
                } catch (error) {
                    console.warn('Ignoring invalid saved roadway calibration', error);
                }

                return {
                    defaults,
                    storageKey,
                    current: {
                        headingOffset: Number(saved.headingOffset ?? defaults.headingOffset) || 0,
                        pitchOffset: Number(saved.pitchOffset ?? defaults.pitchOffset) || 0,
                        rollOffset: Number(saved.rollOffset ?? defaults.rollOffset) || 0,
                        positionOffset: Array.isArray(saved.positionOffset)
                            ? saved.positionOffset.map((value) => Number(value) || 0)
                            : defaults.positionOffset.slice(),
                    },
                };
            }

            async function loadRoadwayImagery(configuration) {
                roadwaySelector.disabled = true;

                if (roadwayNavigator) {
                    roadwayNavigator.destroy();
                    roadwayNavigator = null;
                }
                if (roadwayImages) {
                    potreeViewer.scene.remove360Images(roadwayImages);
                    roadwayImages.dispose();
                    roadwayImages = null;
                }

                try {
                    const csvUrl = resolveManifestUrl(configuration.csv);
                    const separator = csvUrl.lastIndexOf('/');
                    const csvDirectory = csvUrl.slice(0, separator);
                    const csvFilename = csvUrl.slice(separator + 1);
                    const imagePath = resolveManifestUrl(configuration.images || csvDirectory).replace(/\/$/, '');
                    const calibration = getRoadwayCalibration(configuration);

                    roadwayImages = await Potree.Images360Loader.load(
                        csvDirectory,
                        csvFilename,
                        potreeViewer,
                        {
                            imagePath,
                            useCsvOrientation: configuration.useCsvOrientation === true,
                            elevationScale: configuration.elevationScale,
                            imageExtension: configuration.imageExtension,
                            sourceNames: filesToLoad.map((file) => file.name),
                            showMarkers: configuration.showMarkers !== false,
                            headingOffset: calibration.current.headingOffset,
                            pitchOffset: calibration.current.pitchOffset,
                            rollOffset: calibration.current.rollOffset,
                            positionOffset: calibration.current.positionOffset,
                        },
                    );

                    if (roadwayImages.images.length === 0) {
                        throw new Error(`No valid roadway image records were found in ${csvUrl}`);
                    }

                    potreeViewer.scene.add360Images(roadwayImages);
                    roadwayNavigator = new Potree.RoadwayNavigator(potreeViewer, roadwayImages, {
                        title: configuration.name || 'Roadway imagery',
                        panorama: configuration.open360 !== false,
                        defaultCalibration: calibration.defaults,
                        calibrationStorageKey: calibration.storageKey,
                        visibilityControls: [
                            document.getElementById('pointcloud_visibility_control'),
                            document.getElementById('environment_visibility_control'),
                        ],
                    });
                } catch (error) {
                    console.error('Unable to load roadway imagery', error);
                    potreeViewer.postError(`Unable to load roadway imagery: ${error.message}`);
                } finally {
                    roadwaySelector.disabled = false;
                }
            }

            if (roadwayConfigurations.length > 0) {
                roadwaySelector.hidden = false;
                roadwaySelectorControl.hidden = false;
                roadwayConfigurations.forEach((configuration, index) => {
                    const option = document.createElement('option');
                    option.value = String(index);
                    option.textContent = configuration.name || `Roadway ${index + 1}`;
                    roadwaySelector.appendChild(option);
                });
                roadwaySelector.addEventListener('change', () => {
                    loadRoadwayImagery(roadwayConfigurations[Number(roadwaySelector.value)]);
                });
                await loadRoadwayImagery(roadwayConfigurations[0]);
            }

            function toCesium(position) {
                const [longitude, latitude] = toMap.forward([position.x, position.y]);
                const height = position.z * US_SURVEY_FOOT_TO_METERS + verticalOffset;
                return Cesium.Cartesian3.fromDegrees(longitude, latitude, height);
            }

            function loop(timestamp) {
                requestAnimationFrame(loop);

                potreeViewer.update(potreeViewer.clock.getDelta(), timestamp);
                potreeViewer.render();

                const camera = potreeViewer.scene.getActiveCamera();
                const position = new THREE.Vector3(0, 0, 0).applyMatrix4(camera.matrixWorld);
                const upTarget = new THREE.Vector3(0, 600, 0).applyMatrix4(camera.matrixWorld);
                const target = potreeViewer.scene.view.getPivot();

                const cesiumPosition = toCesium(position);
                const cesiumUpTarget = toCesium(upTarget);
                const cesiumTarget = toCesium(target);
                const direction = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(cesiumTarget, cesiumPosition, new Cesium.Cartesian3()), new Cesium.Cartesian3());
                const up = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(cesiumUpTarget, cesiumPosition, new Cesium.Cartesian3()), new Cesium.Cartesian3());

                cesiumViewer.camera.setView({
                    destination: cesiumPosition,
                    orientation: { direction, up },
                });

                const aspect = camera.aspect;
                const fovy = Math.PI * (camera.fov / 180);
                cesiumViewer.camera.frustum.fov = aspect < 1 ? fovy : Math.atan(Math.tan(0.5 * fovy) * aspect) * 2;
                cesiumViewer.render();
            }

            requestAnimationFrame(loop);
        </script>
    </body>
</html>
